<ion-header>
  <ion-toolbar color="secondary">
    <ion-title>Your Cart</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-list *ngIf="cartItems.length > 0">
    <ion-item *ngFor="let item of cartItems">
      <ion-thumbnail slot="start">
        <img [src]="item.imageUrl" alt="{{ item.name }}"/>
      </ion-thumbnail>
      <ion-label>
        <h2>{{ item.name }}</h2>
        <p>${{ item.price }}</p>
      </ion-label>
      <ion-button slot="end" color="danger" (click)="removeItem(item)">
        Remove
      </ion-button>
    </ion-item>
  </ion-list>

  <ion-card *ngIf="cartItems.length > 0">
    <ion-card-content>
      <h3>Total: ${{ total }}</h3>
      <ion-button expand="block" color="primary" (click)="checkout()">Checkout</ion-button>
    </ion-card-content>
  </ion-card>

  <ion-text *ngIf="cartItems.length === 0" color="medium" class="ion-padding">
    Your cart is empty.
  </ion-text>
</ion-content>
